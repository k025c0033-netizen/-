<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マクドナルド 蒲田東口店</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="store-page">
  <header class="store-header">
    <div class="store-logo">McDonald's</div>
    <div class="store-name">蒲田東口店</div>
    <div class="store-tagline">カマタヒガシグチテン</div>

    <!-- 適当な画像（店舗写真風） -->
    <div class="store-image">
      <img src="https://stat.ameba.jp/user_images/20240611/04/eihoka/3c/5e/j/o1182088815450047418.jpg" alt="店舗画像">
    </div>
  </header>

  <main class="store-main">
    <section class="store-info">
      <h2>店舗情報</h2>
      <p class="store-address">144-0052 東京都大田区蒲田5-11-10</p>
      <p class="store-tel">TEL: 03-6428-6220</p>
      <p class="store-seats">座席数: 70席 / 駐車場: 0台</p>
    </section>

    <section class="store-hours">
      <h2>営業時間</h2>
      <ul>
        <li><span>平日</span>24時間営業（朝マック 5:00〜10:30）</li>
        <li><span>土曜</span>24時間営業</li>
        <li><span>日祝</span>24時間営業</li>
        
      </ul>
    </section>

    <section class="store-access">
      <h2>アクセス</h2>
      <ul>
        <li>JR京浜東北線 蒲田駅</li>
        <li>東急池上線 蒲田駅</li>
        <li>東急多摩川線 蒲田駅</li>
        <li>京急本線 京急蒲田駅</li>
        <li>京急空港線 京急蒲田駅</li>
      </ul>
    </section>

    <section class="store-services">
      <h2>サービス・設備</h2>
      <div class="service-badges">
        <span class="badge">店内</span>
        <span class="badge">ドライブスルー</span>
        <span class="badge">朝マック</span>
        <span class="badge badge-wifi">FREE Wi‑Fi</span>
        <span class="badge">モバイルオーダー</span>
      </div>
    </section>

    <section class="store-map">
      <h2>地図</h2>

      <!-- Google Maps 埋め込み -->
            <div class="map-embed">
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3240.799770930934!2d139.716829!3d35.562294!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018f5e3b2c2e8f7%3A0x4c9a3e6fcd508c6!2z44CSMTQ0LTAwNTIg5p2x5Lqs6YO95Y-w5p2x5Yy65rWc5p2-77yR5LiB55uu77yR77yS4oiS77yRIOODk-ODqyDjg6vjg7zjg4g!5e0!3m2!1sja!2sjp!4v1700000000000"
    width="100%"
    height="260"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</div>

    </section>
  </main>
</div>

</body>
</html>
